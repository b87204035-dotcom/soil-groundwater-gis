name: Sync MOENV official data

on:
  schedule:
    - cron: '15 0 1 * *' # Taiwan 08:15 on the first day of every month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/trigger-moenv-sync.txt'

permissions:
  contents: write

concurrency:
  group: moenv-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Verify MOENV API key
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          if [ -z "$MOENV_API_KEY" ]; then
            echo "Repository Secret MOENV_API_KEY is missing." >&2
            exit 1
          fi
          echo "MOENV_API_KEY exists; length=${#MOENV_API_KEY}"

      - name: Download and normalize official datasets
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          python -u source/scripts/sync_moenv_data_v2.py public/data

      - name: Prepare published site
        run: |
          touch public/.nojekyll
          rm -rf public/.git

      - name: Publish synchronized data
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
