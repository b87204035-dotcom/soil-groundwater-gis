name: Publish site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout current published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Add latest enhancement scripts
        run: |
          for file in enhancements-v5.js enhancements-v6.js enhancements-v7.js enhancements-v8.js enhancements-v9.js enhancements-v10.js enhancements-v11.js enhancements-v12.js enhancements-v13.js enhancements-v14.js enhancements-v15.js enhancements-v16.js; do
            if [ -f "source/$file" ]; then cp "source/$file" "public/$file"; fi
          done
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          scripts = [
              ('enhancements-v5.js', '202608022221'),
              ('enhancements-v6.js', '202608030700'),
              ('enhancements-v7.js', '202608032230'),
              ('enhancements-v8.js', '202608032245'),
              ('enhancements-v9.js', '202608032240'),
              ('enhancements-v10.js', '202608032243'),
              ('enhancements-v11.js', '202608040515'),
              ('enhancements-v12.js', '202608050705'),
              ('enhancements-v13.js', '202608050706'),
              ('enhancements-v14.js', '202608161318'),
              ('enhancements-v15.js', '202608161354'),
              ('enhancements-v16.js', '202608161409'),
          ]
          for filename, version in scripts:
              tag = f'<script src="{filename}?v={version}"></script>'
              pattern = rf'<script src="{re.escape(filename)}[^\"]*"></script>'
              if filename not in html:
                  html = html.replace('</body>', tag + '\n</body>')
              else:
                  html = re.sub(pattern, tag, html)
          preload = '<script>try{localStorage.removeItem("moenv_api_key")}catch(e){}</script>'
          if preload not in html:
              first_script = '<script src="enhancements-v5.js'
              position = html.find(first_script)
              if position >= 0:
                  html = html[:position] + preload + '\n' + html[position:]
              else:
                  html = html.replace('</body>', preload + '\n</body>')
          path.write_text(html, encoding='utf-8')
          PY
          touch public/.nojekyll
          rm -rf public/.git

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
