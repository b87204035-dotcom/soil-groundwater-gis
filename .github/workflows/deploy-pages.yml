name: Publish site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout current published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Add latest enhancement scripts
        run: |
          if [ -f source/enhancements-v6.js ]; then
            cp source/enhancements-v6.js public/enhancements-v6.js
            python - <<'PY'
          from pathlib import Path
          import re
          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="enhancements-v6.js?v=202608030700"></script>'
          if 'enhancements-v6.js' not in html:
              html = html.replace('</body>', tag + '\n</body>')
          else:
              html = re.sub(r'<script src="enhancements-v6\.js[^\"]*"></script>', tag, html)
          path.write_text(html, encoding='utf-8')
          PY
          fi
          touch public/.nojekyll
          rm -rf public/.git

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
