name: Publish site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout current published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Add latest enhancement scripts
        run: |
          for file in enhancements-v5.js enhancements-v6.js enhancements-v7.js; do
            if [ -f "source/$file" ]; then cp "source/$file" "public/$file"; fi
          done
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          scripts = [
              ('enhancements-v5.js', '202608022221'),
              ('enhancements-v6.js', '202608030700'),
              ('enhancements-v7.js', '202608032230'),
          ]
          for filename, version in scripts:
              tag = f'<script src="{filename}?v={version}"></script>'
              pattern = rf'<script src="{re.escape(filename)}[^\"]*"></script>'
              if filename not in html:
                  html = html.replace('</body>', tag + '\n</body>')
              else:
                  html = re.sub(pattern, tag, html)
          path.write_text(html, encoding='utf-8')
          PY
          touch public/.nojekyll
          rm -rf public/.git

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
